<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2400" height="900" viewBox="0 0 2400 900">
  <!-- Une tuile et son miroir : les bords se rejoignent toujours, aucune couture quand la tuile se répète. -->
  <filter id="cloud" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".012 .018" numOctaves="4" seed="17" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope="1.8" intercept="-.42"/>
      <feFuncG type="linear" slope="1.75" intercept="-.35"/>
      <feFuncB type="linear" slope="1.7" intercept="-.30"/>
      <feFuncA type="linear" slope="0" intercept="1"/>
    </feComponentTransfer>
  </filter>
  <g id="tile"><path fill="#a5b5bd" d="M0 0h1200v900H0z" filter="url(#cloud)"/></g>
  <use xlink:href="#tile" transform="translate(2400 0) scale(-1 1)"/>
</svg>
