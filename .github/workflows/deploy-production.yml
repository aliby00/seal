name: Deploy · production

# Déclenché par un merge dans main. Structurellement identique au staging,
# à trois différences près : l'environnement production exige une approbation
# humaine, le déploiement vise le projet `seal`, et un échec des smoke tests
# déclenche un rollback automatique.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  # pnpm 12 refuse par défaut d'exécuter les scripts de build des dépendances
  # (ERR_PNPM_IGNORED_BUILDS). La CLI Vercel dépend d'esbuild, qui en a besoin.
  VERCEL: pnpm dlx --allow-build=esbuild vercel@59

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Déployer et vérifier
    needs: ci
    # Interrupteur général : tant que VERCEL_TOKEN n'est pas posé, le job est
    # ignoré proprement au lieu d'échouer sur `vercel pull`. Basculer la
    # variable de dépôt DEPLOYMENTS_ENABLED à "true" pour l'activer.
    if: vars.DEPLOYMENTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # L'approbation se déclenche ici : tant qu'elle n'est pas donnée,
    # le job ne démarre pas et ne peut même pas lire les secrets de production.
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      # Mémorise le déploiement actuellement en ligne, pour pouvoir y revenir.
      - name: Relever le déploiement en cours
        id: previous
        run: |
          url=$($VERCEL ls --prod --token=${{ secrets.VERCEL_TOKEN }} 2>/dev/null \
                | grep -oE 'https://[a-zA-Z0-9.-]+\.vercel\.app' | head -1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Déploiement actuel : ${url:-aucun}"

      - name: Récupérer la configuration Vercel
        run: $VERCEL pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Construire
        run: $VERCEL build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Déployer
        id: deploy
        run: |
          url=$($VERCEL deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Production déployée" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

      # `vercel deploy --prod` n'a pas suffi à promouvoir le déploiement sur le
      # domaine de production : l'ancien restait servi et les smoke tests
      # voyaient un 404. On promeut explicitement plutôt que de compter sur un
      # comportement implicite.
      - name: Promouvoir sur le domaine de production
        run: $VERCEL promote "${{ steps.deploy.outputs.url }}" --token=${{ secrets.VERCEL_TOKEN }}

      - name: Smoke tests
        id: smoke
        run: node scripts/smoke.mjs "${{ vars.PUBLIC_URL }}" production

      # Ne s'exécute que si les smoke tests ont échoué : on repromeut l'ancien.
      - name: Rollback
        if: failure() && steps.smoke.outcome == 'failure' && steps.previous.outputs.url != ''
        run: |
          echo "Smoke tests en échec — retour sur ${{ steps.previous.outputs.url }}"
          $VERCEL rollback "${{ steps.previous.outputs.url }}" \
            --token=${{ secrets.VERCEL_TOKEN }} --yes
          echo "### ⚠️ Rollback effectué" >> "$GITHUB_STEP_SUMMARY"
