name: CI

# Socle partagé. Appelé directement sur les PR et les branches de feature,
# et réutilisé par les deux workflows de déploiement — pour que le staging
# et la production soient contrôlés exactement de la même façon.
on:
  pull_request:
  push:
    branches: ['feat/**']
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Vérifications
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Audit des dépendances
        run: pnpm audit --prod --audit-level=high

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format

      # Aucun appel réseau réel ici : fixtures figées uniquement.
      - name: Tests unitaires
        run: pnpm test

      # Les garde-fous de l'agent : jamais de score, jamais de conseil d'achat.
      - name: Garde-fous de l'agent
        run: pnpm test:guards

      - name: Build
        run: pnpm build

      - name: Installer Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Parcours frontend et accessibilité
        run: pnpm test:e2e
